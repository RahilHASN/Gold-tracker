const inp=(g,k,l,dis)=>`<div><label>${l}</label><input type="number" step="any" value="${S[g][k]}" ${dis?'disabled':''} onchange="setv('${g}','${k}',this.value)"></div>`;
function setv(g,k,v){S[g][k]=+v;if(g=='rates'&&(k=='r22'||k=='r24'))(S.cm[S.city]=S.cm[S.city]||{r22:S.rates.r22,r24:S.rates.r24})[k]=+v;if(g=='rates'){S.rates.at=new Date().toISOString();S.rates.src='Manual entry';hist()}save();render()}
function sett(){const a=S.cfg.auto,c='cfg';
return`<div class="cd"><h2>Rates source & city</h2><div class="f"><div><label>Mode</label><select onchange="S.cfg.auto=+this.value;save();live();render()"><option value="1" ${a?'selected':''}>Live auto-update (every 5 min)</option><option value="0" ${a?'':'selected'}>Manual entry</option></select></div><div><label>City</label><select onchange="setCity(this.value)">${cityOpts()}</select></div><div><label>Premium over spot for ${S.city} %</label><input type="number" step="any" value="${cp()}" onchange="S.cities[S.city]=+this.value;applyCity();hist();save();render()"></div><div><label>Add a city</label><div class="ig"><input id="nc" placeholder="City name" type="text" style="border-right:1px solid var(--bd);border-radius:8px 0 0 8px"><button class="b" style="width:64px;border-radius:0 8px 8px 0" onclick="addCity()">Add</button></div></div></div><h3>Rates for ${S.city} (editable in manual mode; CPI always manual)</h3><div class="f">${inp('rates','r22','22K ₹/g',a)+inp('rates','r24','24K ₹/g',a)+inp('rates','fx','USD/INR',a)+inp('rates','cpi','Latest CPI index')}</div><p>Tip: compare the live rate with your jeweller's board and adjust the city premium % until they match.</p></div>
<div class="cd"><h2>General settings</h2><div class="f">${inp(c,'tgt','Sell-signal target: post-tax return %')+inp(c,'slab','Your tax slab %')+inp(c,'ltcg','Long-term gains tax %')+inp(c,'cess','Cess %')+inp(c,'jew','Jeweller resale deduction %')+inp(c,'coin','Coin/bar resale deduction %')+inp(c,'gg','GST on gold %')+inp(c,'gm','GST on making %')}</div><p>Rules checked Oct 2026: GST 3% gold / 5% making; gold held over 24 months taxed at 12.5% (no indexation), else at slab. Deductions are assumptions: ask your jeweller.</p><button class="b o" style="max-width:260px" onclick="Notification.requestPermission().then(render)">Enable sell-zone notifications</button></div>
<div class="cd tw"><h2>Entries · remove a wrong entry</h2>${S.lots.length?`<table class="nw">${S.lots.map((l,i)=>`<tr><td>${D(l.date)}</td><td>${l.g} g ${l.pur} ${l.form}</td><td>${N(L(l).paid)}</td><td><button class="s" onclick="del(${i})">Remove</button></td></tr>`).join('')}</table>`:'<p>No entries.</p>'}${undo?'<button class="b o" style="max-width:220px;margin-top:8px" onclick="undel()">Undo last removal</button>':''}</div>
<div class="cd"><h2>Backup & erase</h2><p>${FB?'Your data syncs to your cloud account on every device you sign in on. Export makes a local backup copy.':'Data lives in this browser under your account. To move it to another device, export here and import there.'}</p><div class="row"><button class="b" onclick="ex()">Export backup</button><label class="b o" style="padding:8px;text-align:center;cursor:pointer;color:var(--tx)">Import backup<input type="file" accept=".json" style="display:none" onchange="im(this)"></label><button class="b o" onclick="erase()">Erase all</button></div></div>`}
function erase(){if(!confirm('Erase ALL entries and settings for this account? This cannot be undone.'))return;if(!confirm('Warning: this permanently deletes everything in this account. If you are sure, press OK.'))return;localStorage.removeItem('gt2:'+USER);loadU();DR=0;save(1);render()}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='gold-tracker-backup.json';a.click()}
function im(e){const f=e.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);S={...S,...d,rates:{...S.rates,...d.rates},cfg:{...S.cfg,...d.cfg}};save();render()}catch(x){alert('Not a valid backup file.')}})}
function man(){return`<div class="cd m"><h2>How this works</h2><ul><li><b>Signals update instantly.</b> SELL ZONE = a lot's post-tax return reached your target and its real return is positive. HOLD = in profit, below target. WAIT = below break-even.</li><li><b>Cash in hand</b> = resale value after the jeweller's deduction, minus tax on the gain.</li><li><b>Live prices:</b> 24K = gold spot (USD/oz) × USD/INR ÷ 31.1035 × (1 + local premium). 22K = 24K × 22/24. This is an estimate; calibrate the premium to your jeweller. Without internet access to the providers, switch to manual mode.</li><li><b>Calculations tab:</b> pick an entry to see every step, then download Excel or PDF.</li><li>CPI: mospi.gov.in (Combined, General Index, one series always). Enter it monthly in Settings.</li></ul><p>Not financial or tax advice. Confirm tax rules with a chartered accountant before selling.</p></div>`}
if(USER)loadU();render();initFB();live();setInterval(live,3e5);setInterval(()=>{if(T=='Dashboard')render()},6e4);
</script></body></html>
