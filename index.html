if(x.cu!=null){A('Rupee value lost vs USD',`USD/INR ${x.fx} → ${r.fx.toFixed(2)}`,1-x.fx/r.fx,'p');A('Cost in USD','total paid ÷ USD/INR then',+x.cu.toFixed(2),'x');A('Value in USD','cash ÷ USD/INR now',+x.vu.toFixed(2),'x');A('Return in USD terms','USD value ÷ USD cost − 1',x.vu/x.cu-1,'p')}return R}
function calc(){if(!S.lots.length)return'<div class="cd"><p>Add a purchase first.</p></div>';ci=Math.min(ci,S.lots.length-1);const x=L(S.lots[ci]),R=rows(x);
return`<div class="cd"><h2>Detailed calculation</h2><div class="row"><div><label>Select entry</label><select onchange="ci=+this.value;render()">${S.lots.map((l,i)=>`<option value="${i}" ${i==ci?'selected':''}>${D(l.date)} · ${l.g} g ${l.pur} ${l.form}</option>`).join('')}</select></div><button class="b" onclick="xl()">Download Excel</button><button class="b o" onclick="window.print()">Download PDF (Save as PDF)</button></div></div>
<div class="cd tw" id="pr"><h2>Gold purchase calculation · ${D(x.date)} · ${x.g} g ${x.pur} ${x.form}</h2><table><tr><th>Item</th><th>How it is calculated</th><th>Value</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td style="text-align:left;color:var(--mu)">${r[1]}</td><td><b>${r[2]}</b></td></tr>`).join('')}</table><p>Rates as of ${r2()}. Estimate only; not tax advice.</p></div>`}

function rebal(){const A=S.lots.map(L),G=A.reduce((a,x)=>a+x.res,0),c=S.cfg,T0=G+c.other,sh=T0?G/T0:0,amt=sh*100>c.ms?Math.max(0,G-c.ts/100*T0):0;
return`<div class="cd"><h2>Is gold too big a share of your savings?</h2><div class="f">${inp('cfg','other','All OTHER investments (₹)')+inp('cfg','ts','Target gold share %')+inp('cfg','ms','Rebalance trigger %')}</div><div class="k" style="margin-top:12px"><div><small>Gold value</small><b>${N(G)}</b></div><div><small>Gold share</small><b class="${sh*100>c.ms?'a':''}">${P(sh)}</b></div><div><small>Sell to return to target</small><b>${N(amt)}</b></div><div><small>≈ 22K grams</small><b>${amt?(amt/(S.rates.r22*(1-c.jew/100))).toFixed(2):0}</b></div></div><p>${amt?'Sell the oldest (long-term) lots first.':'Within range: no selling needed. Pause new purchases first to let the share fall.'}</p></div>`}
const inp=(g,k,l,dis)=>`<div><label>${l}</label><input type="number" step="any" value="${S[g][k]}" ${dis?'disabled':''} onchange="setv('${g}','${k}',this.value)"></div>`;
function setv(g,k,v){S[g][k]=+v;if(g=='rates'){S.rates.at=new Date().toISOString();S.rates.src='Manual entry';hist()}save();render()}

return`<div class="cd"><h2>Rates source</h2><div class="f"><div><label>Mode</label><select onchange="S.cfg.auto=+this.value;save();live();render()"><option value="1" ${a?'selected':''}>Live auto-update (every 5 min)</option><option value="0" ${a?'':'selected'}>Manual entry</option></select></div>${inp(c,'prem','Local premium over spot % (calibrate to your jeweller)')}</div><h3>Rates (editable only in manual mode; CPI is always manual)</h3><div class="f">${inp('rates','r22','22K ₹/g',a)+inp('rates','r24','24K ₹/g',a)+inp('rates','fx','USD/INR',a)+inp('rates','cpi','Latest CPI index')}</div><p>Tip: compare the live 22K rate with your jeweller's board and adjust the premium % until they match.</p></div>
